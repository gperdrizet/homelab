# meet.perdrizet.org — Jitsi Meet on gatekeeper (repo: /opt/jitsi-meet)
# Install as /etc/nginx/conf.d/jitsi-meet.conf, then: nginx -t && systemctl reload nginx
# certbot: certbot certonly --nginx -d meet.perdrizet.org
# NOTE: if a `map $http_upgrade $connection_upgrade` block already exists in
# any other conf.d file, delete the copy here (duplicate map = nginx error).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.perdrizet.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meet.perdrizet.org;

    ssl_certificate     /etc/letsencrypt/live/git.perdrizet.org/fullchain.pem;  # combined cert: both subdomains
    ssl_certificate_key /etc/letsencrypt/live/git.perdrizet.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Long-lived XMPP websocket connections
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /xmpp-websocket {
        proxy_pass http://127.0.0.1:9080/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        tcp_nodelay on;
    }

    # Colibri websocket (JVB stats/control via web container)
    location /colibri-ws/ {
        proxy_pass http://127.0.0.1:9080/colibri-ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
