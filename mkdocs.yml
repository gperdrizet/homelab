site_name: homelab docs
site_description: Documentation for the gperdrizet homelab infrastructure
site_url: https://gperdrizet.github.io/homelab/
repo_name: gperdrizet/homelab
repo_url: https://github.com/gperdrizet/homelab

theme:
  name: material
  features:
    - navigation.indexes

docs_dir: docs

nav:
  - Home: index.md
  - Agent Orientation: agents.md
  - Machines:
      - Overview: machines.md
      - Gatekeeper: machines/gatekeeper/README.md
      - Pyrite:
          - machines/pyrite/README.md
          - Platform Baseline: machines/pyrite/docs/platform-baseline.md
          - Boot and Startup: machines/pyrite/docs/boot-and-startup.md
          - Wayland and AV: machines/pyrite/docs/wayland-and-av.md
          - Remote Access: machines/pyrite/docs/remote-access.md
          - Troubleshooting: machines/pyrite/docs/troubleshooting.md
          - Change Log: machines/pyrite/docs/change-log.md
          - Platform TODO: machines/pyrite/docs/TODO.md
          - Services: machines/pyrite/services/README.md
      - Arkk: machines/arkk/README.md
  - Network: network.md
  - Operations: operations.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
