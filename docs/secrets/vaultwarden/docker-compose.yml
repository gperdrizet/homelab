## docker-compose.yml (placeholder)

```yaml
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.perdrizet.org"   # or Tailscale-only URL
      SIGNUPS_ALLOWED: "false"                 # disable after initial setup
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN}"
    volumes:
      - vaultwarden_data:/data
    ports:
      - "100.64.0.1:8300:80"  # Tailscale-only recommended

volumes:
  vaultwarden_data:
```

## Notes

- `SIGNUPS_ALLOWED: false` should be set after creating the initial account
- Admin panel at `/admin` — protect with a strong `ADMIN_TOKEN`
- Recommend Tailscale-only exposure (no public nginx vhost) unless you need mobile
  access outside the tailnet
- Mobile access: install Tailscale on phone (voxxel already in tailnet), point
  Bitwarden app at the internal Tailscale URL
