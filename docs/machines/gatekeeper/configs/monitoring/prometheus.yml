# Prometheus Configuration for LogKeep
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'logkeep-production'
    environment: 'production'

# Alertmanager configuration for email alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['monitoring-alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['monitoring-node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'vps-primary'

  # LogKeep PostgreSQL Exporter
  - job_name: 'logkeep-postgres-exporter'
    static_configs:
      - targets: ['logkeep-postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'logkeep'

  # Bench PostgreSQL Exporter
  - job_name: 'bench-postgres-exporter'
    static_configs:
      - targets: ['bench-postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'bench'

  # Pyrite PostgreSQL Exporter
  - job_name: 'pyrite-postgres-exporter'
    static_configs:
      - targets: ['100.64.0.2:9187']
        labels:
          service: 'postgresql'
          database: 'pyrite'
          instance: 'pyrite'

  # LogKeep Application (Production)
  - job_name: 'logkeep-production'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep:8000']
        labels:
          service: 'logkeep'
          slot: 'production'
          environment: 'production'

  # Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['monitoring-cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'vps-primary'

  # Nginx Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['monitoring-nginx-exporter:9113']
        labels:
          service: 'nginx'
          instance: 'vps-primary'

  # Headscale metrics
  - job_name: 'headscale'
    static_configs:
      - targets: ['host.docker.internal:9099']
        labels:
          service: 'headscale'
          instance: 'vps-primary'

  # SSL Certificate Monitoring - sites that return 2xx
  - job_name: 'ssl-certs'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://bench.perdrizet.org
          - https://logkeep.perdrizet.org
          - https://grafana.perdrizet.org
          - https://headplane.perdrizet.org
          - https://jupyter.perdrizet.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115

  # SSL Certificate Monitoring - sites with non-2xx responses (auth/API roots)
  - job_name: 'ssl-certs-reachable'
    metrics_path: /probe
    params:
      module: [http_reachable]
    static_configs:
      - targets:
          - https://headscale.perdrizet.org
          - https://promptlyapi.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115

  # --- inference traffic (monitored at the Promptly gateway, not per-node)
  # All gateway (promptlyapi.com) inference traffic flows through the LiteLLM
  # router on pyrite; its dedicated metrics endpoint exposes per-model
  # request/token/latency/TTFT/cost metrics for the whole inference path.
  # 2026-11-19: per-node llama.cpp scrape jobs (and the 8181 tailnet proxy)
  # removed on purpose - monitor at the gateway, not the model hosts.
  - job_name: 'litellm-router'
    metrics_path: /metrics/
    static_configs:
      - targets: ['100.64.0.2:8505']
        labels:
          service: 'litellm'
          instance: 'pyrite'

  # --- hardware / containers (exporters deployed 2026-11-19)
  - job_name: 'node-exporter-lan'
    static_configs:
      - targets: ['100.64.0.2:9100', '100.64.0.5:9100']
        labels:
          service: 'node-exporter'

  - job_name: 'smartctl-pyrite'
    static_configs:
      - targets: ['100.64.0.2:9633']
        labels:
          service: 'smartctl'
          instance: 'pyrite'

  - job_name: 'cadvisor-lan'
    static_configs:
      - targets: ['100.64.0.2:8180', '100.64.0.5:8180']
        labels:
          service: 'cadvisor'

  - job_name: 'dcgm-gpu-pyrite'
    static_configs:
      - targets: ['100.64.0.2:9400']
        labels:
          service: 'gpu'
          instance: 'pyrite'

  - job_name: 'blackbox-tailnet'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '100.64.0.2:8502'
          - '100.64.0.2:5432'
          - '100.64.0.2:47302'
          - '100.64.0.5:8080'
          - '10.1.10.204:25565'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-blackbox-exporter:9115
