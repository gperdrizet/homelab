# git.perdrizet.org — Forgejo on gatekeeper (upstream: /opt/forgejo)
# Install as /etc/nginx/conf.d/forgejo.conf, then: nginx -t && systemctl reload nginx
# certbot: certbot certonly --nginx -d git.perdrizet.org

server {
    listen 80;
    listen [::]:80;
    server_name git.perdrizet.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name git.perdrizet.org;

    ssl_certificate     /etc/letsencrypt/live/git.perdrizet.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.perdrizet.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Large pushes / LFS
    client_max_body_size 1024m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Smart HTTP: never buffer git RPC bodies
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
