<svg xmlns="http://www.w3.org/2000/svg" width="270" height="100" viewBox="0 0 270 100">
  <!-- Option A: Isometric cube, side view, golden gradients -->
  <defs>
    <linearGradient id="a-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF6E"/>
      <stop offset="100%" stop-color="#D4A820"/>
    </linearGradient>
    <linearGradient id="a-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C49018"/>
      <stop offset="100%" stop-color="#9A6C08"/>
    </linearGradient>
    <linearGradient id="a-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B6010"/>
      <stop offset="100%" stop-color="#5A3C04"/>
    </linearGradient>
  </defs>
  <!-- Top face -->
  <polygon points="52,6 92,26 52,46 12,26" fill="url(#a-top)" stroke="#7A5800" stroke-width="1.2"/>
  <!-- Right face -->
  <polygon points="92,26 92,74 52,94 52,46" fill="url(#a-right)" stroke="#7A5800" stroke-width="1.2"/>
  <!-- Left face -->
  <polygon points="12,26 52,46 52,94 12,74" fill="url(#a-left)" stroke="#7A5800" stroke-width="1.2"/>
  <!-- Wordmark -->
  <text x="108" y="64" font-family="'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">pyrite</text>
</svg>
